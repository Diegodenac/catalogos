name: Tipo de cambio BCB
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tc/actualizar.mjs
      - name: Guardar si cambió
        run: |
          if ! git diff --quiet tc.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tc.json
            git commit -m "TC BCB $(node -p "require('./tc.json').tco") ($(node -p "require('./tc.json').fecha"))"
            git push
          fi
