<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Catálogos digitales</title>
  <style>
    :root { --bg: #f5f6f8; --txt: #1b1f24; --sub: #5b6470; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1216; --txt: #e8eaed; --sub: #9aa3ad; } }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--txt); display: grid; place-items: center; min-height: 100vh; padding: 16px; box-sizing: border-box; text-align: center; }
    p { color: var(--sub); max-width: 420px; }
  </style>
</head>
<body>
  <main>
    <h1>Catálogos digitales</h1>
    <p>Catálogos para celular con precios en bolivianos al tipo de cambio del día y pedidos por WhatsApp. Cochabamba, Bolivia.</p>
  </main>
</body>
</html>
